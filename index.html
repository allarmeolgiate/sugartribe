<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADIO SUGAR TRIBE - La Tua Energia</title>

    <!-- Font Futuristi Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome per Icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #080c16;
            --blue-primary: #1d4ed8;
            --blue-glow: #2563eb;
            --orange-energy: #ff6b00;
            --green-neon: #00ff88;
            --cyan-glow: #00f0ff;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(37, 99, 235, 0.3);
            --text-main: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(29, 78, 216, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 107, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.08) 0%, transparent 60%);
            background-attachment: fixed;
        }

        /* Container Principale */
        .container {
            width: 92%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 0;
        }

        /* Navbar / Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(8, 12, 22, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            max-height: 55px;
            filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.5));
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a:hover {
            color: var(--cyan-glow);
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        /* SEZIONE HERO & PLAYER ALTO */
        .hero-player-section {
            margin-top: 20px;
            margin-bottom: 40px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 30px rgba(29, 78, 216, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-player-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--orange-energy), var(--cyan-glow), var(--green-neon));
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 107, 0, 0.15);
            border: 1px solid var(--orange-energy);
            color: var(--orange-energy);
            padding: 6px 16px;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: var(--orange-energy);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--orange-energy);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Canvas Spettro Audio */
        .visualizer-container {
            width: 100%;
            height: 140px;
            margin: 15px 0 25px 0;
            position: relative;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Controlli Player Audio */
        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .btn-play-pause {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue-glow), var(--cyan-glow));
            border: none;
            color: #000;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-play-pause:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
        }

            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .volume-control i {
            color: var(--cyan-glow);
            font-size: 1.2rem;
            width: 20px;
            text-align: center;
            cursor: pointer;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--green-neon);

        /* Orologio & Data Futuristica */

            align-items: center;

            padding: 30px;

        .contact-grid {

        .contact-card {

        .contact-card.whatsapp i { color: #25D366; }
        .contact-card.email i { color: #ea4335; }

        .contact-card:hover {
            transform: translateY(-5px);
            border-color: var(--cyan-glow);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .contact-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .contact-card p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }

        /* Responsive Smartphone */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .digital-clock {
                font-size: 2.2rem;
            }

            .schedule-item {
                flex-direction: column;
                align-items: flex-start;

            }

            .time-badge {
                min-width: auto;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

    <!-- LOGICA JAVASCRIPT INTEGRATA -->
    <script>
        /* --- 1. OROLOGIO E DATA --- */
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('it-IT', options);
            document.getElementById('date').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* --- 2. CONTROLLI AUDIO & VISUALIZER --- */
        const audio = document.getElementById('radioStream');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const canvas = document.getElementById('audioVisualizer');
        const ctx = canvas.getContext('2d');

        let audioCtx, analyser, source;
        let isAudioSetup = false;

        function initAudioContext() {
            if (isAudioSetup) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 64;
            isAudioSetup = true;
            drawVisualizer();
        }

        playPauseBtn.addEventListener('click', () => {
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (audio.paused) {
                audio.play();
                playIcon.className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                playIcon.className = 'fa-solid fa-play';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            if (audio.volume === 0) {
                volumeIcon.className = 'fa-solid fa-volume-xmark';
            } else if (audio.volume < 0.5) {
                volumeIcon.className = 'fa-solid fa-volume-low';
            } else {
                volumeIcon.className = 'fa-solid fa-volume-high';
            }
        });

        /* Visualizzatore Dinamico */
        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const width = canvas.width = canvas.clientWidth;
            const height = canvas.height = canvas.clientHeight;

            ctx.clearRect(0, 0, width, height);

            if (!isAudioSetup) {
                // Linea statica quando l'audio non è avviato
                ctx.beginPath();
                ctx.moveTo(0, height / 2);
                ctx.lineTo(width, height / 2);
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
                return;
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const barWidth = (width / bufferLength) * 1.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = (dataArray[i] / 255) * height;

                const gradient = ctx.createLinearGradient(0, height, 0, 0);
                gradient.addColorStop(0, '#1d4ed8');
                gradient.addColorStop(0.5, '#00f0ff');
                gradient.addColorStop(1, '#ff6b00');

                ctx.fillStyle = gradient;
                ctx.fillRect(x, height - barHeight, barWidth - 4, barHeight);

                x += barWidth + 2;
            }
        }
        drawVisualizer();

        /* --- 3. GESTIONE PALINSESTO & ADMIN --- */
        let isAdmin = false;
        let adminPassword = "sugartribe2026"; // Password di default
        let currentDay = "Lunedì";

        // Dati Iniziali Palinsesto
        let scheduleData = JSON.parse(localStorage.getItem('sugarTribeSchedule')) || {
            "Lunedì": [
                { id: 1, time: "07:00 - 09:00", name: "Sugar Morning Tribe", dj: "DJ Alex & Sara" },
                { id: 2, time: "14:00 - 16:00", name: "Energy Zone", dj: "Marco Techno" },
                { id: 3, time: "21:00 - 23:00", name: "Night Tribal Beats", dj: "Guest DJ" }
            ],
            "Martedì": [
                { id: 4, time: "08:00 - 10:00", name: "Wake Up Tribe", dj: "DJ Chris" },
                { id: 5, time: "18:00 - 20:00", name: "Sunset Vibes", dj: "Elena M" }
            ],
            "Mercoledì": [
                { id: 6, time: "12:00 - 14:00", name: "Midday Break", dj: "Staff Sugar Tribe" }
            ],
            "Giovedì": [
                { id: 7, time: "16:00 - 18:00", name: "Deep Energy", dj: "Leo Noise" }
            ],
            "Venerdì": [
                { id: 8, time: "22:00 - 02:00", name: "Friday Tribal Party", dj: "Resident Masters" }
            ],
            "Sabato": [
                { id: 9, time: "15:00 - 19:00", name: "Weekend Chart 40", dj: "Luca Mix" }
            ],
            "Domenica": [
                { id: 10, time: "10:00 - 13:00", name: "Chillout Tribe", dj: "Relax Crew" }
            ]
        };

        function renderSchedule() {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';

            const list = scheduleData[currentDay] || [];

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: rgba(255,255,255,0.5);">Nessun programma presente per ${currentDay}.</div>`;
                return;
            }

            list.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'schedule-item';
                div.innerHTML = `
                    <div class="time-badge"><i class="fa-regular fa-clock"></i> ${item.time}</div>
                    <div class="show-info">
                        <div class="show-title">${item.name}</div>
                        <div class="show-dj"><i class="fa-solid fa-microphone"></i> ${item.dj}</div>
                    </div>
                    ${isAdmin ? `
                        <div class="admin-controls">
                            <button class="btn-admin-action" onclick="deleteShow(${index})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        function selectDay(day, btn) {
            currentDay = day;
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSchedule();
        }

        function toggleAdmin() {
            if (!isAdmin) {
                const pass = prompt("Inserisci la password per accedere alla Regia:");
                if (pass === adminPassword) {
                    isAdmin = true;
                    document.getElementById('adminToggleBtn').innerHTML = '<i class="fa-solid fa-lock-open"></i> Blocco Regia';
                    document.getElementById('addShowBtn').style.display = 'inline-block';
                    alert("Autenticazione riuscita! Ora puoi aggiungere ed eliminare gli show.");
                } else if(pass !== null) {
                    alert("Password errata!");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminToggleBtn').innerHTML = '<i class="fa-solid fa-lock"></i> Sblocca Regia';
                document.getElementById('addShowBtn').style.display = 'none';
            }
            renderSchedule();
        }

        function addShow() {
            if (!isAdmin) return;
            const time = prompt("Inserisci l'orario (es. 10:00 - 12:00):");
            if (!time) return;
            const name = prompt("Inserisci il nome del programma:");
            if (!name) return;
            const dj = prompt("Inserisci il nome del DJ / Conduttore:");
            if (!dj) return;

            if (!scheduleData[currentDay]) scheduleData[currentDay] = [];
            scheduleData[currentDay].push({ id: Date.now(), time, name, dj });

            saveSchedule();
            renderSchedule();
        }

        function deleteShow(index) {
            if (!isAdmin) return;
            if (confirm("Sei sicuro di voler eliminare questo programma dal palinsesto?")) {
                scheduleData[currentDay].splice(index, 1);
                saveSchedule();
                renderSchedule();
            }
        }

        function saveSchedule() {
            localStorage.setItem('sugarTribeSchedule', JSON.stringify(scheduleData));
        }

        // Inizializza visualizzazione
        renderSchedule();
    </script>
</body>
</html>
